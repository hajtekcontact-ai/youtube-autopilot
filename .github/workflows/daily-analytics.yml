# YouTube AI Autopilot - Analytics Collection
# يعمل يومياً لجمع تحليلات اليوتيوب
name: Daily Analytics

on:
  schedule:
    # Run twice daily at 6 AM and 6 PM UTC
    - cron: '0 6,18 * * *'
  workflow_dispatch:

concurrency:
  group: analytics-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore persistent state
        uses: actions/cache@v4
        with:
          path: data/
          key: autopilot-state-${{ github.run_number }}
          restore-keys: |
            autopilot-state-

      - name: Collect analytics
        run: python main.py collect-analytics
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          DATABASE_URL: sqlite:///data/autopilot.db
          TIMEZONE: America/New_York

      - name: Save persistent state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/
          key: autopilot-state-${{ github.run_number }}
