# YouTube AI Autopilot - Daily Video Production
# يعمل يومياً لإنتاج ونشر الفيديوهات
name: Daily Video Production

on:
  schedule:
    # Run every 2 hours to handle all 5 daily slots with buffer
    # GitHub Actions cron can have delays up to 15-30 min
    - cron: '0 11,14,17,20,23,1 * * *'  # UTC times covering NY schedule
  workflow_dispatch:
    inputs:
      mode:
        description: 'Production mode'
        required: true
        default: 'produce'
        type: choice
        options:
          - produce
          - dry-run
          - test-render

concurrency:
  group: video-production
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  TIMEZONE: 'America/New_York'

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore persistent state
        uses: actions/cache@v4
        with:
          path: |
            data/
          key: autopilot-state-${{ github.run_number }}
          restore-keys: |
            autopilot-state-

      - name: Check system health
        run: python main.py health
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          DATABASE_URL: sqlite:///data/autopilot.db

      - name: Run production pipeline
        run: |
          MODE=${{ github.event.inputs.mode || 'produce' }}
          python main.py $MODE
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          DATABASE_URL: sqlite:///data/autopilot.db
          APP_ENV: production
          TIMEZONE: America/New_York
          TTS_VOICE: en-US-GuyNeural
          CONTENT_LANGUAGE: en-US
          CHANNEL_NICHE: science_technology_education

      - name: Upload production artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-${{ github.run_number }}
          path: |
            output/
            data/autopilot.db
            logs/
          retention-days: 7

      - name: Save persistent state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/
          key: autopilot-state-${{ github.run_number }}

      - name: Report status
        if: always()
        run: |
          echo "Production run completed"
          python main.py health || true
